<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Gioia 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#f2e3dc;overflow:hidden}canvas{display:block}</style></head><body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Живая обложка VK 9:16. Цикл 8 с: нитка жемчуга, золотая цепь и барочная жемчужина на шёлке в цветах сайта Gioia.
var q=new URLSearchParams(location.search),W=+(q.get('w')||540),H=+(q.get('h')||960),DUR=8;
var r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});r.setSize(W,H);r.setPixelRatio(1);
r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=.66;r.outputEncoding=THREE.sRGBEncoding;r.physicallyCorrectLights=false;
r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFShadowMap;document.body.appendChild(r.domElement);
var sc=new THREE.Scene();sc.background=new THREE.Color('#f2e3dc');
var cam=new THREE.PerspectiveCamera(30,W/H,.1,60);
// студийное окружение: мягкие окна на тёплом фоне
function envTex(){var c=document.createElement('canvas');c.width=1024;c.height=512;var g=c.getContext('2d');
 var gr=g.createLinearGradient(0,0,0,512);gr.addColorStop(0,'#f0d6c2');gr.addColorStop(.5,'#a87e66');gr.addColorStop(1,'#2b1a12');g.fillStyle=gr;g.fillRect(0,0,1024,512);
 g.fillStyle='#ffffff';g.filter='blur(14px)';g.fillRect(120,40,190,190);g.fillRect(640,60,250,120);g.fillStyle='#ffe9cf';g.fillRect(430,20,90,240);g.fillStyle='#3a241b';g.fillRect(330,130,60,170);g.fillRect(900,150,70,150);g.filter='none';
 var t=new THREE.CanvasTexture(c);t.mapping=THREE.EquirectangularReflectionMapping;t.encoding=THREE.sRGBEncoding;return t}
var pm=new THREE.PMREMGenerator(r);var env=pm.fromEquirectangular(envTex()).texture;sc.environment=env;
sc.add(new THREE.HemisphereLight('#fff4ea','#b08e7a',.12));var rim=new THREE.DirectionalLight('#fff6ec',.55);rim.position.set(5,4,7);sc.add(rim);
var key=new THREE.DirectionalLight('#ffe9d2',1.25);key.position.set(-3.2,6.5,3);key.castShadow=true;key.shadow.mapSize.set(2048,2048);
var s=key.shadow.camera;s.left=-5;s.right=5;s.top=7;s.bottom=-7;s.far=20;key.shadow.radius=7;key.shadow.bias=-.0006;sc.add(key);
// шёлк
var SEG=150,sg=new THREE.PlaneGeometry(14,22,SEG,Math.round(SEG*1.5)),sp=sg.attributes.position;
function fold(x,y,t){var a=2*Math.PI*t;return .22*Math.sin(x*.55+y*.36+Math.sin(a)*.22)+.09*Math.sin(x*1.2-y*.7+1.1+Math.cos(a)*.26)}
var cloth=new THREE.Mesh(sg,new THREE.MeshPhysicalMaterial({color:'#f0c4ae',roughness:.36,metalness:.02,clearcoat:.35,clearcoatRoughness:.5,envMapIntensity:.95}));
cloth.rotation.x=0;cloth.position.z=-.34;cloth.receiveShadow=true;sc.add(cloth);
function clothUp(t){for(var i=0;i<sp.count;i++)sp.setZ(i,fold(sp.getX(i),sp.getY(i),t));sp.needsUpdate=true;sg.computeVertexNormals()}
var J=new THREE.Group();J.scale.setScalar(.55);J.position.y=1.35;sc.add(J);
// кривая колье: подковой, открытая внизу к подвеске
function neck(u){var a=-Math.PI*.5+2*Math.PI*u;var R=2.38;var x=R*Math.cos(a)*.86,y=R*Math.sin(a)*1.26+.5;return new THREE.Vector3(x,y,.02*Math.sin(a*3))}
// жемчуг: тонкий перламутр, лёгкое отличие тона и размера каждой
var pearlM=new THREE.MeshPhysicalMaterial({color:'#e8d9c2',roughness:.2,metalness:.0,clearcoat:1,clearcoatRoughness:.06,envMapIntensity:1.75,reflectivity:.9});
var PG=new THREE.SphereGeometry(1,48,36),N=60,im=new THREE.InstancedMesh(PG,pearlM,N),d=new THREE.Object3D(),col=new THREE.Color(),seed=function(i){var h=Math.sin(i*73.13)*9931.7;return h-Math.floor(h)};
var u0=.545,u1=1.195,positions=[],acc=0;
var L=[];for(var i=0;i<=400;i++)L.push(neck(u0+(u1-u0)*i/400));
var cum=[0];for(i=1;i<L.length;i++)cum.push(cum[i-1]+L[i].distanceTo(L[i-1]));var T=cum[cum.length-1];
function at(dst){var k=0;while(k<cum.length-2&&cum[k+1]<dst)k++;var f=(dst-cum[k])/(cum[k+1]-cum[k]);return L[k].clone().lerp(L[k+1],f)}
var rad=.128,placed=0,pos=rad;
for(i=0;i<N&&pos<T-rad*.5;i++){var rr=rad*(.94+.1*seed(i)),p=at(pos+rr);d.position.copy(p);d.position.z+=rr*.75;d.scale.setScalar(rr);d.rotation.set(seed(i)*6,seed(i+9)*6,0);d.updateMatrix();im.setMatrixAt(i,d.matrix);col.set('#e6d6be').offsetHSL(.008*(seed(i+3)-.5),.05*(seed(i+5)-.5),.03*(seed(i+7)-.5));im.setColorAt(i,col);pos+=rr*2.03;placed++}
im.count=placed;im.castShadow=true;J.add(im);
// золотая цепь: крупные овальные звенья (как у колье Honey)
var goldM=new THREE.MeshStandardMaterial({color:'#d79a3c',metalness:1,roughness:.2,envMapIntensity:2.2});
var linkG=new THREE.TorusGeometry(.135,.04,20,46);linkG.scale(1.35,.85,1);
var CL=[],u2=u1-1,u3=u0;for(i=0;i<=300;i++)CL.push(neck(u2+(u3-u2)*i/300));
var ccum=[0];for(i=1;i<CL.length;i++)ccum.push(ccum[i-1]+CL[i].distanceTo(CL[i-1]));var CT=ccum[ccum.length-1];
function cat(dst){var k=0;while(k<ccum.length-2&&ccum[k+1]<dst)k++;var f=(dst-ccum[k])/(ccum[k+1]-ccum[k]);return{p:CL[k].clone().lerp(CL[k+1],f),t:CL[k+1].clone().sub(CL[k]).normalize()}}
var LN=Math.floor(CT/.31),lm=new THREE.InstancedMesh(linkG,goldM,LN);
for(i=0;i<LN;i++){var o=cat((i+.5)/LN*CT);d.position.copy(o.p);d.position.z+=.09;d.scale.setScalar(1);d.rotation.set(i%2?1.05:-.2,0,Math.atan2(o.t.y,o.t.x));d.updateMatrix();lm.setMatrixAt(i,d.matrix)}
lm.castShadow=true;J.add(lm);
// подвеска: T-замок-кольцо и барочная жемчужина неправильной формы
var bottom=neck(.0);bottom=neck(u0);bottom.lerp(neck(u1),.5);bottom.y=neck(1).y;
var P=new THREE.Group();P.position.set(0,neck(1).y-.07,.14);J.add(P);
var toggle=new THREE.Mesh(new THREE.TorusGeometry(.2,.052,24,64),goldM);toggle.castShadow=true;P.add(toggle);
var bar=new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,.62,20),goldM);bar.rotation.z=Math.PI/2;bar.position.set(0,.2,.04);bar.castShadow=true;P.add(bar);
var bail=new THREE.Mesh(new THREE.TorusGeometry(.085,.03,16,40),goldM);bail.position.set(0,-.26,0);bail.rotation.y=Math.PI/2;bail.castShadow=true;P.add(bail);
var bg=new THREE.SphereGeometry(.62,160,120),bp=bg.attributes.position,v=new THREE.Vector3();
for(i=0;i<bp.count;i++){v.fromBufferAttribute(bp,i);var n=v.clone().normalize(),b=1+.075*Math.sin(n.x*3.1+n.y*2.2)+.04*Math.sin(n.y*5.3+n.z*2.8+1.2);var taper=1-.2*Math.max(0,n.y);v.copy(n).multiplyScalar(.5*b);v.x*=taper*.94;v.y*=1.28;v.z*=taper*.78;bp.setXYZ(i,v.x,v.y,v.z)}
bg.computeVertexNormals();
var baroque=new THREE.Mesh(bg,new THREE.MeshPhysicalMaterial({color:'#e4d3bd',roughness:.13,clearcoat:1,clearcoatRoughness:.05,envMapIntensity:2.3,reflectivity:.9}));baroque.position.set(0,-1,.05);baroque.castShadow=true;P.add(baroque);
// блик-звёзды
function star(){var c=document.createElement('canvas');c.width=c.height=128;var g=c.getContext('2d');g.translate(64,64);var gr=g.createRadialGradient(0,0,0,0,0,60);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(.09,'rgba(255,246,226,.75)');gr.addColorStop(1,'rgba(255,240,210,0)');g.fillStyle=gr;for(var i=0;i<2;i++){g.rotate(Math.PI/4*i*2);g.beginPath();g.moveTo(-60,0);g.lineTo(0,-2.4);g.lineTo(60,0);g.lineTo(0,2.4);g.closePath();g.fill()}g.beginPath();g.arc(0,0,16,0,7);g.fill();var t=new THREE.CanvasTexture(c);return t}
var st=star(),SP=[];[[-1.45,-.6],[1.6,1.2],[.32,-.98],[-1.72,1.7],[1.15,-.9],[0,3.05],[-.6,-2.15]].forEach(function(a,i){var m=new THREE.SpriteMaterial({map:st,blending:THREE.AdditiveBlending,depthWrite:false,transparent:true});var o=new THREE.Sprite(m);o.position.set(a[0],a[1],.7);J.add(o);SP.push({o:o,ph:i/7})});
function frame(t){ // t 0..1 бесшовно
 var a=2*Math.PI*t;clothUp(t);
 cam.position.set(Math.sin(a)*.55,Math.cos(a)*.4+.05,13.2+Math.sin(a)*.25);cam.lookAt(0,.05,0);
 J.rotation.z=Math.sin(a)*.018;
 P.rotation.z=Math.sin(a)*.09;P.rotation.y=Math.sin(a)*.5;
 key.position.set(-1.7+Math.sin(a)*1.2,3.2,8+Math.cos(a)*.7);
 SP.forEach(function(s){var k=Math.max(0,Math.sin(2*Math.PI*(t*2+s.ph)));k=Math.pow(k,6);s.o.scale.setScalar(.06+k*.34);s.o.material.opacity=k});
 r.render(sc,cam)}
window.renderAt=function(t){frame(t);return true};
window.ready=true;
if(!q.has('cap')){var t0=performance.now();(function L(n){frame(((n-t0)/1000/DUR)%1);requestAnimationFrame(L)})(t0)}
</script></body></html>
